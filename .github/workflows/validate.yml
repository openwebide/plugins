name: Validate packages

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate.py
      - run: python scripts/validate.py --catalog examples/language-marketplace.json
      - run: python -m unittest discover -s tests -v

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: openwebide/openwebide
          ref: 546e4e7a454a43d4ac2c2824563d09136b98f4be
          path: .host-sdk
          persist-credentials: false
      - name: Install the host's pinned Rust toolchain
        run: |
          channel=$(python3 -c 'import tomllib; print(tomllib.load(open(".host-sdk/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$channel" --profile minimal --component clippy --target wasm32-wasip2
      - name: Test and compile executable plugin sources
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          sdk_path=$(python3 .host-sdk/tools/install_wasi_sdk.py "$RUNNER_TEMP/wasi-sdk")
          export WASI_SDK_PATH="$sdk_path"
          export WASI_SYSROOT="$sdk_path/share/wasi-sysroot"
          python3 scripts/validate_rust.py --sdk .host-sdk/crates/plugin-sdk
